<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>加油站</title>
</head>

<body>
  <script type="text/javascript">
    /**
     * @param {number[]} gas
     * @param {number[]} cost
     * @return {number}
     */
    var canCompleteCircuit = function(gas, cost) {
        let total_gas = 0;
        let total_cost = 0;
        let start = 0;
        let cur = 0;

        for(let i = 0; i < gas.length; i++){
            total_gas += gas[i];
            total_cost += cost[i];

            cur += gas[i] - cost[i];

            if (cur < 0) {
              start = i + 1;
              cur = 0;
            }
        }

        return total_gas >= total_cost ? start : -1;
    };

    let gas = [1,2,3,4,5];
    let cost = [3,4,5,1,2];

    let res = canCompleteCircuit(gas, cost);
    console.log(res);
  </script>
</body>

</html>
