<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>二分查找公式</title>
</head>

<body>
  <script type="text/javascript">

    function search(arr, target) {
      let left = 0,
        right = arr.length - 1;

      console.log(target, 'target');

      while (left <= right) {
        let mid = left + ((right - left) >> 1);
        console.log(mid, 'mid', arr[mid]);
        console.log(left, right, 'left, right');
        if (arr[mid] === target) {
          return mid;
        } else if (arr[mid] < target) {
          left = mid + 1; // 防止死循环
        } else {
          right = mid - 1; // 防止死循环
        }
      }

      return -1;
    }

    function search2(nums, target) {
      let left = 0,
        right = nums.length - 1,
        first = 0,
        last = 0;

      while (left <= right) {
        let mid = left + ((right - left) >> 1);

        if (nums[mid] === target) {
          first = mid;
          right = mid - 1;
        } else if (nums[mid] < target) {
          left = mid + 1;
        } else {
          right = mid - 1;
        }
      }

      left = 0;
      right = nums.length - 1;

      while (left <= right) {
        let mid = left + ((right - left) >> 1);

        if (nums[mid] === target) {
          last = mid;
          left = mid + 1;
        } else if (nums[mid] < target) {
          left = mid + 1;
        } else {
          right = mid - 1;
        }
      }

      return [first, last];
    }

    const binarySearch = (nums, target, lower) => {
      let left = 0,
        right = nums.length - 1;
      ans = nums.length;

      while (left <= right) {
        let mid = left + ((right - left) >> 1);
        if (nums[mid] > target || (lower && nums[mid] >= target)) {
          right = mid - 1;
          ans = mid;
        } else {
          left = mid + 1
        }
      }

      return ans;
    }

    var searchRange = function (nums, target) {
      let left = 0,
        right = nums.length - 1,
        first = binarySearch(nums, target, true),
        last = binarySearch(nums, target, false) - 1;


      if (first <= last && last <= right && nums[first] === target && nums[last] === target) {
        return [first, last];
      }

      return [-1, -1];
    };

    // console.log(search([1, 2, 3, 4, 5, 5, 6, 7], 5)); // 4
    // console.log(search2([1, 2, 3, 3, 3, 4, 5, 6, 7], 3)); // [2, 4]
    console.log(searchRange([1, 2, 3, 3, 3, 4, 5, 6, 7], 3)); // [2, 4]
  </script>
</body>

</html>
