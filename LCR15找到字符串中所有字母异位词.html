<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>找到字符串中所有字母异位词</title>
</head>
<body>
  <script type="text/javascript">
    // 给定两个字符串 s 和 p，找到 s 中所有 p 的 变位词 的子串，返回这些子串的起始索引。不考虑答案输出的顺序。

    // 变位词 指字母相同，但排列不同的字符串。
    
    // 示例 1：

    // 输入: s = "cbaebabacd", p = "abc"
    // 输出: [0,6]
    // 解释:
    // 起始索引等于 0 的子串是 "cba", 它是 "abc" 的变位词。
    // 起始索引等于 6 的子串是 "bac", 它是 "abc" 的变位词。

    /**
     * @param {string} s
     * @param {string} p
     * @return {number[]}
     */
    var findAnagrams = function(s, p) {
      let sLength = s.length,
          pLength = p.length;

      if (sLength < pLength) return [];

      let left = 0,
          right = 0;
      let windowMap = new Map(),
          pMap = new Map(),
          valid = 0,
          res = [];
      
      for (const char of p) {
        pMap.set(char, (pMap.get(char) || 0) + 1);
      }

      let need = pMap.size;

      console.log(need, 'need');

      while (right < sLength) {
        console.log(111);
        const curChar = s[right];
        right++;
        
        // 窗口右边界的逻辑
        if (pMap.has(curChar)) {
          windowMap.set(curChar, (windowMap.get(curChar) || 0) + 1);
          if (windowMap.get(curChar) === pMap.get(curChar)) {
            valid++;
          }
        }

        // 当窗口边界超过 pLength 时，需要移动左边界
        while (right - left > pLength) {
          const leftChar = s[left];
          if (pMap.has(leftChar)) {
            if (windowMap.get(leftChar) === pMap.get(leftChar)) {
              valid--;
            }
            windowMap.set(leftChar, windowMap.get(leftChar) - 1);
          }
          left++;
        }

        if (valid === need) {
          res.push(left);
        }
      }
      
      return res;
    };

    console.log(findAnagrams("cbaebabacd", "abc"));

  </script>
</body>
</html>
